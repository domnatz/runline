name: runline

x-db-client-env: &db-client-env
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: runline
  RUNLINE_DEMO_MODE: ${RUNLINE_DEMO_MODE:-true}

x-storage-credentials: &storage-credentials
  AWS_ACCESS_KEY_ID: ${RUNLINE_S3_ACCESS_KEY:-runline_local}
  AWS_SECRET_ACCESS_KEY: ${RUNLINE_S3_SECRET_KEY:-runline_local_storage_secret}

x-storage-env: &storage-env
  <<: *storage-credentials
  RUNLINE_S3_ENDPOINT: http://storage:8333
  RUNLINE_S3_BUCKET: runline-documents

services:
  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: runline
      POSTGRES_USER: runline_owner
      POSTGRES_PASSWORD: ${RUNLINE_DB_PASSWORD:-runline_local_owner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      target: api
    command: ["node", "dist/migrate.js"]
    environment:
      <<: *db-client-env
      PGUSER: runline_owner
      PGPASSWORD: ${RUNLINE_DB_PASSWORD:-runline_local_owner}
      RUNLINE_APP_PASSWORD: ${RUNLINE_APP_PASSWORD:-runline_local_app}
      RUNLINE_DOCUMENTS_PASSWORD: ${RUNLINE_DOCUMENTS_PASSWORD:-runline_local_documents}
    networks: [data]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    init: true
    restart: unless-stopped
    environment:
      <<: [*db-client-env, *storage-env]
      PGUSER: runline_app
      PGPASSWORD: ${RUNLINE_APP_PASSWORD:-runline_local_app}
      RUNLINE_API_HOST: 0.0.0.0
      RUNLINE_SESSION_SECRET: ${RUNLINE_SESSION_SECRET:-}
      RUNLINE_SECURE_COOKIE: ${RUNLINE_SECURE_COOKIE:-false}
      RUNLINE_OSRM_ORIGIN: http://routing:5000
    networks: [web, data]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - queue-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  routing:
    build: ./infra/routing
    restart: unless-stopped
    networks: [data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/nearest/v1/driving/121.0326,14.5657"]
      interval: 5s
      timeout: 3s
      retries: 12

  storage:
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    environment:
      <<: *storage-credentials
      S3_BUCKET: runline-documents
    volumes:
      - document-data:/data
    networks: [data]

  worker:
    build:
      context: .
      target: api
    command: ["node", "dist/document-worker.js"]
    init: true
    restart: unless-stopped
    environment:
      <<: [*db-client-env, *storage-env]
      PGUSER: runline_documents
      PGPASSWORD: ${RUNLINE_DOCUMENTS_PASSWORD:-runline_local_documents}
      RUNLINE_REDIS_HOST: redis
    networks: [data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage:
        condition: service_started

  web:
    build:
      context: .
      target: web
    init: true
    restart: unless-stopped
    environment:
      RUNLINE_API_ORIGIN: http://api:4000
    ports:
      - "127.0.0.1:${RUNLINE_WEB_PORT:-3000}:3000"
    networks: [web]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12

networks:
  web:
  data:
    internal: true

volumes:
  pgdata:
  queue-data:
  document-data:
